<!DOCTYPE html>
<html>

<head>

<title>Admin Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}


body{

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#667eea,#764ba2);

}



.login-container{

    width:380px;
    background:white;
    padding:40px;
    border-radius:20px;
    box-shadow:0 15px 35px rgba(0,0,0,0.2);

}



.logo{

    text-align:center;
    font-size:35px;
    margin-bottom:10px;

}



h2{

    text-align:center;
    margin-bottom:30px;
    color:#333;

}



.input-box{

    margin-bottom:20px;

}



.input-box label{

    display:block;
    margin-bottom:8px;
    color:#555;
    font-weight:500;

}



.input-box input{

    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    outline:none;
    font-size:15px;

}



.input-box input:focus{

    border-color:#667eea;

}



button{

    width:100%;
    padding:13px;
    border:none;
    border-radius:10px;
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;

}



button:hover{

    transform:scale(1.03);

}



#error{

    color:red;
    text-align:center;
    margin-top:15px;

}



.admin-text{

    text-align:center;
    margin-top:20px;
    color:#777;
    font-size:14px;

}


</style>


</head>


<body>


<div class="login-container">


<div class="logo">
🛒
</div>


<h2>Admin Login</h2>



<div class="input-box">

<label>Email</label>

<input 
type="email"
id="email"
placeholder="Enter admin email">

</div>




<div class="input-box">

<label>Password</label>

<input 
type="password"
id="password"
placeholder="Enter password">

</div>




<button onclick="adminLogin()">
Login
</button>



<p id="error"></p>



<div class="admin-text">

SimpleShop Admin Panel

</div>



</div>





<script>


function adminLogin(){


let email=document.getElementById("email").value;

let password=document.getElementById("password").value;



fetch("https://simpleshop-backend.onrender.com/admin/login",{


method:"POST",

headers:{

"Content-Type":"application/json"

},


body:JSON.stringify({

email:email,

password:password

})


})


.then(response=>response.json())


.then(data=>{


if(data.success){


localStorage.setItem("admin","true");


window.location.href="admin.html";


}

else{


document.getElementById("error").innerHTML=data.message;


}


})


.catch(error=>{


document.getElementById("error").innerHTML="Server error";


});


}



</script>


</body>

</html>
