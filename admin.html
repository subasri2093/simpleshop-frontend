<!DOCTYPE html>
<html>

<head>

<title>Admin Dashboard</title>


<style>


body{

    font-family:Arial, sans-serif;
    background:#f5f5f5;
    padding:20px;

}



h1{

    text-align:center;
    color:#333;

}



h2{

    margin-top:40px;
    color:#444;

}



/* DASHBOARD CARDS */


.cards{

    display:flex;
    justify-content:center;
    gap:20px;
    margin:30px;
    flex-wrap:wrap;

}



.card{

    background:white;
    width:200px;
    padding:20px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 0 10px #ccc;

}



.card h3{

    color:#555;

}



.card p{

    font-size:28px;
    font-weight:bold;
    color:#222;

}





.container{

    margin-bottom:40px;

}




table{

    width:90%;
    margin:auto;
    border-collapse:collapse;
    background:white;

}



th{

    background:#333;
    color:white;
    padding:12px;

}



td{

    padding:12px;
    text-align:center;
    border:1px solid #ddd;

}



tr:hover{

    background:#f1f1f1;

}



</style>


</head>



<body>



<h1>Admin Dashboard</h1>





<!-- ================= CARDS ================= -->


<div class="cards">


<div class="card">

<h3>Total Users</h3>

<p id="totalUsers">0</p>

</div>



<div class="card">

<h3>Total Orders</h3>

<p id="totalOrders">0</p>

</div>



<div class="card">

<h3>Total Products</h3>

<p id="totalProducts">0</p>

</div>



<div class="card">

<h3>Total Sales</h3>

<p id="totalSales">$0</p>

</div>


</div>








<!-- ================= USERS ================= -->


<div class="container">


<h2>Users List</h2>


<table>


<thead>

<tr>

<th>Name</th>
<th>Email</th>
<th>Password</th>

</tr>


</thead>


<tbody id="userTable">


</tbody>


</table>


</div>








<!-- ================= ORDERS ================= -->


<div class="container">


<h2>Orders List</h2>


<table>


<thead>

<tr>

<th>Order ID</th>
<th>Product</th>
<th>Price</th>
<th>Status</th>
<th>Date</th>

</tr>


</thead>


<tbody id="orderTable">


</tbody>


</table>


</div>








<!-- ================= PRODUCTS ================= -->


<div class="container">


<h2>Products List</h2>


<table>


<thead>

<tr>

<th>Product ID</th>
<th>Product Name</th>
<th>Price</th>
<th>Category</th>

</tr>


</thead>


<tbody id="productTable">


</tbody>


</table>


</div>








<script>




// ================= DASHBOARD =================



fetch("https://simpleshop-backend.onrender.com/admin/dashboard")


.then(response=>response.json())


.then(data=>{


document.getElementById("totalUsers").innerHTML=data.users;


document.getElementById("totalOrders").innerHTML=data.orders;


document.getElementById("totalProducts").innerHTML=data.products;


document.getElementById("totalSales").innerHTML="$"+data.sales;



})

.catch(error=>{


console.log("Dashboard Error:",error);


});









// ================= USERS =================



fetch("https://simpleshop-backend.onrender.com/users")


.then(response=>response.json())


.then(users=>{


let rows="";



users.forEach(user=>{


rows += `


<tr>

<td>${user.name || "N/A"}</td>

<td>${user.email || "N/A"}</td>

<td>${user.password || "N/A"}</td>


</tr>


`;


});



document.getElementById("userTable").innerHTML=rows;


})


.catch(error=>{


console.log("Users Error:",error);


});









// ================= ORDERS =================



fetch("https://simpleshop-backend.onrender.com/orders")


.then(response=>response.json())


.then(orders=>{


let rows="";



orders.forEach(order=>{


rows += `


<tr>


<td>${order.id || "N/A"}</td>


<td>${order.product?.name || "N/A"}</td>


<td>${order.product?.price || "N/A"}</td>


<td>${order.status || "N/A"}</td>


<td>${order.date || "N/A"}</td>


</tr>


`;



});



document.getElementById("orderTable").innerHTML=rows;



})


.catch(error=>{


console.log("Orders Error:",error);


});









// ================= PRODUCTS =================




fetch("https://simpleshop-backend.onrender.com/products")

.then(response=>response.json())


.then(products=>{


let rows="";



products.forEach(product=>{


rows += `


<tr>


<td>${product.id}</td>


<td>${product.name}</td>


<td>${product.price}</td>


<td>${product.category}</td>


</tr>


`;



});



document.getElementById("productTable").innerHTML=rows;



})


.catch(error=>{


console.log("Products Error:",error);


});





</script>



</body>


</html>
